<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>districtO1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#fff;color:#000;font-family:"Space Grotesk", sans-serif;text-transform:uppercase;letter-spacing:.05em}
    a{color:inherit;text-decoration:none}
    
    /* Header Style */
    header{height:70px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #000;position:sticky;top:0;background:#fff;z-index:10}
    .header-left, .header-right{display:flex;gap:20px;align-items:center;font-size:14px}
    .logo{font-weight:700;font-size:22px;letter-spacing:.15em}
    
    /* Menu Drawer */
    .menu-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;z-index:99}
    .menu-drawer{position:fixed;top:0;left:-320px;width:320px;height:100%;background:#fff;border-right:1px solid #000;transition:left .3s ease;z-index:100;padding:30px 24px}
    .menu-drawer.active{left:0}
    .close-menu{font-size:24px;cursor:pointer;margin-bottom:40px;display:inline-block}
    .menu-links{display:flex;flex-direction:column;gap:20px;font-size:18px;font-weight:600}
    
    /* Product Grid Style (2 columns matching the reference) */
    .shop-section{padding:20px 0}
    .products-grid{display:grid;grid-template-columns:repeat(2, 1fr);border-top:1px solid #000}
    .product-card{border-right:1px solid #000;border-bottom:1px solid #000;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between}
    .product-card:nth-child(even){border-right:none}
    .product-image{width:100%;height:280px;background:#f4f4f4;position:relative;overflow:hidden;margin-bottom:16px}
    .product-image img{width:100%;height:100%;object-fit:cover;display:block}
    .product-tag{position:absolute;top:10px;left:10px;background:#000;color:#fff;font-size:9px;padding:4px 8px;letter-spacing:.1em}
    .product-details{font-size:12px;line-height:1.5}
    .product-title{font-weight:600;margin-bottom:4px}
    .product-price{color:#333;margin-top:6px}

    /* Newsletter & Footer */
    .newsletter{padding:60px 24px;border-bottom:1px solid #000;text-align:center}
    .newsletter h3{font-size:13px;margin-bottom:16px;letter-spacing:.1em}
    .newsletter-form{display:flex;max-width:400px;margin:0 auto;border:1px solid #000}
    .newsletter-form input{flex:1;border:none;padding:14px;outline:none;font:inherit;font-size:11px;text-transform:none}
    .newsletter-form button{background:#000;color:#fff;border:none;padding:0 20px;font:inherit;font-size:11px;cursor:pointer;letter-spacing:.1em}

    footer{padding:30px 24px;font-size:11px;display:flex;flex-direction:column;gap:12px;align-items:center;border-bottom:1px solid #000}
    .footer-links{display:flex;gap:20px;color:#555}

    /* Floating WhatsApp Button */
    .wa{position:fixed;right:20px;bottom:20px;background:#000;color:#fff;padding:12px 16px;font-size:10px;letter-spacing:.1em;z-index:5}

    @media(min-width: 768px){
      .products-grid{grid-template-columns:repeat(3, 1fr)}
      .product-card:nth-child(even){border-right:1px solid #000}
      .product-card:nth-child(3n){border-right:none}
      .product-image{height:380px}
    }
  </style>
</head>
<body>

  <!-- Menu Drawer -->
  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="menu-drawer" id="menuDrawer">
    <span class="close-menu" onclick="toggleMenu()">✕</span>
    <div class="menu-links">
      <a href="#">Shop All</a>
      <a href="#">Sweatshirts</a>
      <a href="#">Tees</a>
      <a href="#contact">Contact</a>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <span onclick="toggleMenu()" style="cursor:pointer; font-size:18px;">☰</span>
      <span style="cursor:pointer;">🔍</span>
    </div>
    <div class="logo">districtO1</div>
    <div class="header-right">
      <span>👤</span>
      <span>🛒 (0)</span>
    </div>
  </header>

  <main>
    <section class="shop-section" id="shop">
      <div class="products-grid">
        
        <!-- Product 1 -->
        <article class="product-card">
          <div class="product-image">
            <span class="product-tag">AVAILABLE NOW</span>
            <img src="hoodie-product.png" alt="Find Peace Sweatshirt">
          </div>
          <div class="product-details">
            <div class="product-title">Find Peace Sweatshirt</div>
            <div style="color:#777; font-size:10px;">Burgundy · Graphic crewneck</div>
            <div class="product-price">LE 750.00</div>
          </div>
        </article>

        <!-- Product 2 (Example for grid balance) -->
        <article class="product-card">
          <div class="product-image">
            <span class="product-tag" style="background:#555;">COMING SOON</span>
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85" alt="Essential Tee">
          </div>
          <div class="product-details">
            <div class="product-title">District Essential Tee</div>
            <div style="color:#777; font-size:10px;">Off-white · Relaxed fit</div>
            <div class="product-price">LE 650.00</div>
          </div>
        </article>

      </div>
    </section>

    <!-- Newsletter -->
    <section class="newsletter" id="contact">
      <h3>SIGN UP TO THE DISTRICT01 NEWSLETTER</h3>
      <div class="newsletter-form">
        <input type="email" placeholder="E-mail address">
        <button type="button" onclick="alert('Subscribed successfully!')">SIGN UP</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <a href="#">Terms and Policies</a>
    </div>
    <div>© 2026 DISTRICT01</div>
  </footer>

  <a class="wa" href="https://wa.me/201143761413?text=Hello%20districtO1%2C%20I%27m%20interested%20in%20your%20collection." target="_blank">Order via WhatsApp ↗</a>

  <script>
    function toggleMenu() {
      const drawer = document.getElementById('menuDrawer');
      const overlay = document.getElementById('menuOverlay');
      drawer.classList.toggle('active');
      overlay.style.display = drawer.classList.contains('active') ? 'block' : 'none';
    }
  </script>
</body>
</html>
